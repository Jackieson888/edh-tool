# Base tag vocabulary. This is the ONLY set of tags the tagger may emit and the
# only building blocks commander themes may use. Change it deliberately: bump
# `version` whenever a tag is added/renamed/removed, because stored card tags
# record the vocab version they were produced against.
#
# Every tag has two sides:
#   enabler - the card PRODUCES / sets up this resource or pattern
#   payoff  - the card CARES ABOUT / rewards having this resource or pattern
# A card can be both (e.g. a proliferate card that also draws per counter).
#
# Typal (creature type) tags are NOT listed here. They are parameterized as
# `typal:<Type>` (e.g. typal:Mutant) and derived by rules from type lines plus
# oracle text, so the vocabulary doesn't need 300 creature types.

version: 0.2.0   # 0.2.0: added shrink

categories:
  counters: Counters of all kinds and ways to add/move/multiply them
  poison: Poison / infect / toxic plan
  tokens: Creating and caring about tokens
  graveyard: Filling and using graveyards
  sacrifice: Sacrificing permanents and death triggers
  life: Lifegain, lifeloss, draining
  spells: Instants/sorceries and casting matters
  permanents: Artifacts, enchantments, equipment, auras
  lands: Land drops, landfall, ramp by lands
  combat: Attacking, evasion, extra combats, keyword soup
  interaction: Removal, counterspells, protection
  resources: Card draw, ramp, tutors, treasure, energy
  bodies: Creature-body matters (power, stats, ETB, blink)
  gameplan: Big-picture strategies spanning categories

tags:
  # ---------------- counters ----------------
  - id: plus1_counters
    category: counters
    definition: +1/+1 counters.
    enabler: Puts +1/+1 counters on creatures.
    payoff: Rewards creatures having or getting +1/+1 counters.
  - id: minus1_counters
    category: counters
    definition: -1/-1 counters (including wither).
    enabler: Puts -1/-1 counters on creatures.
    payoff: Rewards -1/-1 counters being placed or present.
  - id: proliferate
    category: counters
    definition: Proliferate or other effects that add one of each counter already present.
    enabler: Proliferates or copies counter increments across permanents/players.
    payoff: Rewards proliferating specifically.
  - id: counter_doubling
    category: counters
    definition: Doubling or increasing the number of counters placed.
    enabler: Doubles or adds extra counters when counters are placed.
    payoff: n/a (use the counter type's own payoff tag).
  - id: counter_movement
    category: counters
    definition: Moving counters between permanents.
    enabler: Moves counters from one permanent to another.
    payoff: Rewards counters leaving or moving.
  - id: rad_counters
    category: counters
    definition: Rad counters (Fallout) placed on players.
    enabler: Gives players rad counters.
    payoff: Rewards players having rad counters or milling nonlands from rad.
  - id: oil_counters
    category: counters
    definition: Oil counters (Phyrexia) on permanents.
    enabler: Puts oil counters on permanents.
    payoff: Removes or counts oil counters for value.
  - id: charge_counters
    category: counters
    definition: Charge, lore, time and other resource counters on non-planeswalker permanents.
    enabler: Adds these counters (sagas, suspend, charge).
    payoff: Rewards having many such counters.
  - id: planeswalkers
    category: permanents
    definition: Planeswalkers and loyalty counters (superfriends).
    enabler: Is a planeswalker or adds loyalty.
    payoff: Rewards controlling planeswalkers or activating loyalty abilities.
  - id: shield_counters
    category: counters
    definition: Shield counters and similar protective counters.
    enabler: Puts shield counters on permanents.
    payoff: Rewards permanents with shield counters.
  - id: stun_counters
    category: counters
    definition: Stun counters.
    enabler: Puts stun counters on permanents.
    payoff: Rewards stunned permanents.
  - id: player_counters
    category: counters
    definition: Counters on players (poison, rad, experience, energy count separately).
    enabler: Gives players counters of any kind.
    payoff: Rewards counters on players.
  - id: experience_counters
    category: counters
    definition: Experience counters.
    enabler: Gives you experience counters.
    payoff: Scales with experience counters.

  # ---------------- poison ----------------
  - id: infect
    category: poison
    definition: Infect, toxic, poisonous and other ways to deal damage as poison.
    enabler: Deals damage as poison counters or grants infect/toxic.
    payoff: Rewards opponents having poison counters.
  - id: poison_direct
    category: poison
    definition: Giving poison counters without combat damage.
    enabler: Directly gives players poison counters (not via combat damage).
    payoff: n/a.

  # ---------------- tokens ----------------
  - id: creature_tokens
    category: tokens
    definition: Creature tokens.
    enabler: Creates creature tokens.
    payoff: Rewards having or creating creature tokens / go-wide boards.
  - id: noncreature_tokens
    category: tokens
    definition: Treasure, Clue, Food, Blood, Map and other noncreature tokens.
    enabler: Creates noncreature tokens.
    payoff: Rewards creating or sacrificing such tokens.
  - id: token_doubling
    category: tokens
    definition: Doubling tokens or copying token creation.
    enabler: Creates extra tokens when tokens are created.
    payoff: n/a.
  - id: go_wide
    category: tokens
    definition: Many creatures at once; anthems and mass pump.
    enabler: Produces many bodies.
    payoff: Anthems, "for each creature you control", mass pump.

  # ---------------- graveyard ----------------
  - id: self_mill
    category: graveyard
    definition: Putting your own cards into your graveyard (mill, surveil, discard-to-fill).
    enabler: Mills/surveils/fills your graveyard.
    payoff: Rewards cards entering your graveyard.
  - id: opponent_mill
    category: graveyard
    definition: Milling opponents.
    enabler: Mills opponents.
    payoff: Rewards opponents' cards entering graveyards.
  - id: reanimation
    category: graveyard
    definition: Returning creatures from graveyard to battlefield.
    enabler: Puts big threats into the graveyard to be reanimated.
    payoff: Returns creatures from graveyard to battlefield.
  - id: recursion
    category: graveyard
    definition: Returning cards from graveyard to hand or casting from graveyard.
    enabler: n/a.
    payoff: Returns or recasts cards from graveyard.
  - id: graveyard_size
    category: graveyard
    definition: Card counts or types in graveyard (threshold, delirium, descend).
    enabler: Fills graveyard.
    payoff: Scales with graveyard size or card types in it.
  - id: graveyard_hate
    category: graveyard
    definition: Exiling graveyards.
    enabler: Exiles cards from graveyards.
    payoff: Rewards exiling cards from graveyards.

  # ---------------- sacrifice ----------------
  - id: sac_outlet
    category: sacrifice
    definition: Free or repeatable ways to sacrifice your own permanents.
    enabler: Lets you sacrifice permanents on demand.
    payoff: n/a.
  - id: death_trigger
    category: sacrifice
    definition: Value when creatures die (aristocrats payoffs, blood artist effects).
    enabler: Provides fodder that wants to die.
    payoff: Triggers when creatures die / are sacrificed.
  - id: sac_fodder
    category: sacrifice
    definition: Permanents that are good to sacrifice (recurring, token-making, dies-value).
    enabler: Is or makes expendable permanents.
    payoff: n/a.
  - id: edict
    category: sacrifice
    definition: Forcing opponents to sacrifice.
    enabler: Makes opponents sacrifice permanents.
    payoff: n/a.

  # ---------------- life ----------------
  - id: lifegain
    category: life
    definition: Gaining life.
    enabler: Gains life, especially repeatedly.
    payoff: Triggers or scales on lifegain.
  - id: drain
    category: life
    definition: Opponents losing life outside combat.
    enabler: Makes opponents lose life directly.
    payoff: Rewards opponents losing life.
  - id: pay_life
    category: life
    definition: Using your own life total as a resource.
    enabler: n/a.
    payoff: Converts life into cards/mana/effects.

  # ---------------- spells ----------------
  - id: spellslinger
    category: spells
    definition: Casting instants and sorceries.
    enabler: Is a cheap instant/sorcery or makes them cheaper.
    payoff: Triggers on casting instants/sorceries.
  - id: storm_count
    category: spells
    definition: Many spells in one turn (storm, magecraft chains).
    enabler: Cheap spells, rituals, untappers.
    payoff: Scales with spells cast this turn.
  - id: copy_spells
    category: spells
    definition: Copying spells.
    enabler: Copies spells.
    payoff: n/a.
  - id: flash
    category: spells
    definition: Playing on the opponent's turn.
    enabler: Has or grants flash.
    payoff: Rewards casting on other turns.
  - id: cast_from_exile
    category: spells
    definition: Impulse draw, foretell, cascade, casting from exile.
    enabler: Exiles cards you may play.
    payoff: Rewards casting from exile / other zones.

  # ---------------- permanents ----------------
  - id: artifacts_matter
    category: permanents
    definition: Artifacts.
    enabler: Is or makes artifacts.
    payoff: Rewards artifacts.
  - id: enchantments_matter
    category: permanents
    definition: Enchantments (constellation, enchantress).
    enabler: Is or makes enchantments.
    payoff: Rewards enchantments.
  - id: equipment
    category: permanents
    definition: Equipment.
    enabler: Is equipment or reduces equip costs.
    payoff: Rewards equipped creatures.
  - id: auras
    category: permanents
    definition: Auras.
    enabler: Is an aura.
    payoff: Rewards enchanted creatures.
  - id: vehicles
    category: permanents
    definition: Vehicles and crewing.
    enabler: Is a vehicle.
    payoff: Rewards crewing / vehicles.

  # ---------------- lands ----------------
  - id: landfall
    category: lands
    definition: Lands entering.
    enabler: Extra land drops, fetches, land ramp.
    payoff: Triggers on lands entering.
  - id: lands_matter
    category: lands
    definition: Land count, lands in graveyard, land recursion.
    enabler: Puts lands into play/graveyard.
    payoff: Scales with lands.
  - id: ramp
    category: resources
    definition: Mana acceleration.
    enabler: Produces extra mana or puts lands onto the battlefield.
    payoff: n/a.

  # ---------------- combat ----------------
  - id: evasion
    category: combat
    definition: Hard-to-block damage (flying, unblockable, menace, shadow).
    enabler: Has or grants evasion.
    payoff: n/a.
  - id: trample
    category: combat
    definition: Trample.
    enabler: Has or grants trample.
    payoff: n/a.
  - id: attack_triggers
    category: combat
    definition: Things that happen when creatures attack.
    enabler: Grants extra attacks / pushes attacks (goad, vigilance, untap).
    payoff: Triggers when attacking.
  - id: combat_damage_triggers
    category: combat
    definition: Things that happen when creatures deal combat damage to players.
    enabler: Evasion or protection that ensures connection.
    payoff: Triggers on combat damage to a player.
  - id: extra_combat
    category: combat
    definition: Additional combat phases.
    enabler: Grants extra combats.
    payoff: n/a.
  - id: pump
    category: combat
    definition: Increasing creature power/toughness.
    enabler: Pumps creatures.
    payoff: n/a.
  - id: keyword_soup
    category: combat
    definition: Granting many keywords.
    enabler: Grants keywords.
    payoff: Rewards creatures with keywords.
  - id: goad
    category: combat
    definition: Forcing opponents' creatures to attack others.
    enabler: Goads or forces attacks.
    payoff: Rewards opponents attacking each other.
  - id: voltron
    category: gameplan
    definition: Making one creature (usually the commander) huge and lethal.
    enabler: Buffs or protects a single creature.
    payoff: n/a.

  # ---------------- interaction ----------------
  - id: spot_removal
    category: interaction
    definition: Removing a single permanent.
    enabler: Destroys, exiles, bounces or shrinks one permanent.
    payoff: n/a.
  - id: shrink
    category: interaction
    definition: Temporary -X/-X effects ("gets -3/-3 until end of turn"), targeted or mass. Not counters - see minus1_counters.
    enabler: Gives creatures -N/-N or -X/-X.
    payoff: Rewards creatures shrinking or dying with 0 or less toughness.
  - id: board_wipe
    category: interaction
    definition: Mass removal.
    enabler: Removes many permanents at once.
    payoff: n/a.
  - id: counterspell
    category: interaction
    definition: Countering spells or abilities.
    enabler: Counters spells or abilities.
    payoff: n/a.
  - id: protection
    category: interaction
    definition: Protecting your permanents (hexproof, indestructible, phasing, blink-to-save).
    enabler: Protects permanents.
    payoff: n/a.
  - id: stax
    category: interaction
    definition: Taxing or restricting opponents' resources.
    enabler: Taxes, restricts, or locks.
    payoff: n/a.
  - id: tap_down
    category: interaction
    definition: Tapping or freezing opposing permanents.
    enabler: Taps or keeps permanents tapped.
    payoff: n/a.
  - id: theft
    category: interaction
    definition: Stealing or copying opponents' stuff.
    enabler: Gains control of / casts / copies opponents' cards.
    payoff: Rewards controlling things you don't own.

  # ---------------- resources ----------------
  - id: card_draw
    category: resources
    definition: Drawing extra cards.
    enabler: Draws cards.
    payoff: Triggers on drawing cards.
  - id: tutor
    category: resources
    definition: Searching your library for specific cards.
    enabler: Tutors.
    payoff: n/a.
  - id: treasure
    category: resources
    definition: Treasure tokens specifically.
    enabler: Makes Treasure.
    payoff: Rewards Treasure / artifact sacrifice.
  - id: energy
    category: resources
    definition: Energy counters.
    enabler: Gives you energy.
    payoff: Spends energy.
  - id: cost_reduction
    category: resources
    definition: Making spells or abilities cheaper.
    enabler: Reduces costs.
    payoff: n/a.
  - id: untap
    category: resources
    definition: Untapping permanents.
    enabler: Untaps permanents.
    payoff: Rewards untapping or has powerful tap abilities.

  # ---------------- bodies ----------------
  - id: etb_value
    category: bodies
    definition: Enter-the-battlefield triggers.
    enabler: Has valuable ETB triggers.
    payoff: Doubles or rewards ETBs.
  - id: blink
    category: bodies
    definition: Exiling and returning permanents to reuse ETBs.
    enabler: Blinks/flickers.
    payoff: n/a (use etb_value payoff).
  - id: big_power
    category: bodies
    definition: High-power creatures (ferocious, power matters).
    enabler: Has high power or boosts power.
    payoff: Rewards high power.
  - id: toughness_matters
    category: bodies
    definition: Defenders, walls, assigning damage by toughness.
    enabler: High-toughness creatures.
    payoff: Rewards toughness.
  - id: mutate
    category: bodies
    definition: Mutate and merged permanents.
    enabler: Has mutate.
    payoff: Rewards mutating.
  - id: clones
    category: bodies
    definition: Copying creatures/permanents.
    enabler: Copies permanents.
    payoff: n/a.
  - id: legends_matter
    category: bodies
    definition: Legendary permanents / historic.
    enabler: Is legendary or historic.
    payoff: Rewards legendaries or historic spells.
  - id: modified
    category: bodies
    definition: Modified creatures (counters, equipment, auras on them).
    enabler: Modifies creatures.
    payoff: Rewards modified creatures.

  # ---------------- gameplan ----------------
  - id: group_hug
    category: gameplan
    definition: Giving all players resources.
    enabler: Symmetrical gifts to all players.
    payoff: Benefits from everyone having more.
  - id: group_slug
    category: gameplan
    definition: Symmetrical damage to everyone.
    enabler: Pings every player / punishes everyone.
    payoff: n/a.
  - id: alt_wincon
    category: gameplan
    definition: Winning or eliminating players outside normal damage.
    enabler: n/a.
    payoff: Wins the game or eliminates a player by its own condition.
  - id: politics
    category: gameplan
    definition: Deals, votes, monarch, initiative, gifts.
    enabler: Creates political decisions.
    payoff: n/a.
