  drain strength: [[shrink, enabler]]
  sweeper: [[board_wipe, enabler]]
  sweeper-one-sided: [[board_wipe, enabler]]
  multi removal: [[spot_removal, enabler]]
  protects-creature: [[protection, enabler]]
  protects-all: [[protection, enabler]]
  protects-permanent: [[protection, enabler]]
  protects-planeswalker: [[protection, enabler], [planeswalkers, payoff]]
  gives indestructible: [[protection, enabler]]
