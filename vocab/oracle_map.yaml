# Maps Scryfall Tagger ORACLE tags (tagger.scryfall.com, type "oracle": what a card
# does) onto our base tags. These are human-curated, so they are fed to the tagging model
# as high-confidence hints and used afterwards as a recall check.
#
# Format:  "<tagger label>": [[our_tag, role], ...]      role: enabler | payoff | both
# `patterns` apply to whole label families (regex, first match wins after exact labels).
# Labels not listed are ignored (flavor/meta tags like "alliteration", "namesake spell").
version: 0.1.0

exact:
  # counters
  gives pp counters: [[plus1_counters, enabler]]
  gives pp counters to all: [[plus1_counters, enabler], [go_wide, payoff]]
  repeatable pp counters: [[plus1_counters, enabler]]
  gains pp counters: [[plus1_counters, payoff]]
  pp counters matter: [[plus1_counters, payoff]]
  counter fuel-pp: [[plus1_counters, payoff]]
  gives mm counters: [[minus1_counters, enabler]]
  gains mm counters: [[minus1_counters, both]]
  mm counters matter: [[minus1_counters, payoff]]
  mm counter cost: [[minus1_counters, both]]
  repeatable-proliferate: [[proliferate, enabler]]
  pseudo-proliferate: [[proliferate, enabler]]
  synergy-proliferate: [[proliferate, payoff]]
  counter doubler: [[counter_doubling, enabler]]
  counter increaser: [[counter_doubling, enabler]]
  move counters: [[counter_movement, enabler]]
  counter fuel-oil: [[oil_counters, both]]
  oil counters matter: [[oil_counters, payoff]]
  counter fuel-charge: [[charge_counters, both]]
  energy generator: [[energy, enabler]]
  counter fuel-energy: [[energy, payoff]]
  # poison
  poisonous: [[infect, enabler]]
  poison opponents: [[poison_direct, enabler]]
  synergy-poison: [[infect, payoff]]
  # tokens
  repeatable creature tokens: [[creature_tokens, enabler]]
  synergy-token-creature: [[creature_tokens, payoff]]
  synergy-token: [[creature_tokens, payoff]]
  repeatable artifact tokens: [[noncreature_tokens, enabler], [artifacts_matter, enabler]]
  repeatable noncreature tokens: [[noncreature_tokens, enabler]]
  token doubler: [[token_doubling, enabler]]
  token increaser: [[token_doubling, enabler]]
  anthem: [[go_wide, payoff]]
  keyword anthem: [[go_wide, payoff], [keyword_soup, enabler]]
  power boost to all: [[go_wide, payoff], [pump, enabler]]
  repeatable treasures: [[treasure, enabler], [ramp, enabler]]
  synergy-treasure: [[treasure, payoff]]
  # graveyard
  mill-self: [[self_mill, enabler]]
  mill-opponent: [[opponent_mill, enabler]]
  mill-any: [[self_mill, enabler], [opponent_mill, enabler]]
  mill-each: [[opponent_mill, enabler], [group_slug, enabler]]
  synergy-mill: [[self_mill, payoff]]
  cards in graveyard matter: [[graveyard_size, payoff]]
  card types in graveyard matter: [[graveyard_size, payoff]]
  threshold: [[graveyard_size, payoff]]
  graveyard fuel: [[graveyard_size, payoff]]
  castable from graveyard: [[recursion, payoff]]
  gives castable from graveyard: [[recursion, enabler]]
  activate from graveyard: [[recursion, payoff]]
  hate-graveyard: [[graveyard_hate, enabler]]
  sweeper-graveyard: [[graveyard_hate, enabler]]
  mass reanimation: [[reanimation, enabler]]
  reanimate matters: [[reanimation, payoff]]
  # sacrifice / death
  free sacrifice outlet: [[sac_outlet, enabler]]
  repeatable sacrifice outlet: [[sac_outlet, enabler]]
  death trigger: [[death_trigger, payoff]]
