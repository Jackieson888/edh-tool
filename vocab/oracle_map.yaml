  adds multiple mana: [[ramp, enabler]]
  landfall: [[landfall, payoff]]
  tokenfall: [[creature_tokens, payoff]]
  play additional land: [[landfall, enabler], [lands_matter, enabler]]
  extra land: [[landfall, enabler], [lands_matter, enabler]]
  land count matters: [[lands_matter, payoff]]
  lands matter: [[lands_matter, payoff]]
  lands in graveyard matter: [[lands_matter, payoff]]
  cost reducer: [[cost_reduction, enabler]]
  # combat
  evasion: [[evasion, enabler]]
