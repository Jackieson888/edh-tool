patterns:
  - ["^typal-(?!choose|share|non-|neo-)(.+)$", typal, payoff]     # typal-zombie -> typal:Zombie
  - ["^tutor-(?!copy)", tutor, enabler]
  - ["^reanimate-", reanimation, enabler]
  - ["^removal-(creature|destroy|exile|bounce|permanent|nonland|planeswalker|artifact|enchantment|fight|tuck)$", spot_removal, enabler]
  - ["^counterspell(-(soft|reusable|creature|ability|exile|automatic|noncreature|instant|sorcery|bounce|artifact|sacrifice))?$", counterspell, enabler]
  - ["^sacrifice outlet-", sac_outlet, enabler]
  - ["^copy-(instant|sorcery|spell)$", copy_spells, enabler]
  - ["^impulse-", cast_from_exile, enabler]
