  # Tagger's "group slug" covers anything hitting several players (incl. only opponents),
  # broader than our symmetric group_slug, so it's deliberately left unmapped.
  group hug: [[group_hug, enabler]]
  selective group hug: [[group_hug, enabler], [politics, enabler]]
  monarch matters: [[politics, both]]
